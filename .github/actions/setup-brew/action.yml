name: "Setup Homebrew/Linuxbrew"
description: "Install Homebrew on macOS or Linuxbrew on Linux"
author: "glasswing-api"

runs:
  using: "composite"
  steps:
    - name: Restore Homebrew cache
      id: brew-restore-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          /home/linuxbrew/.linuxbrew
          /opt/homebrew
          /usr/local/Homebrew
        key: brew-${{ runner.os }}-latest
        restore-keys: brew-${{ runner.os }}-

    - name: Install Homebrew (macOS) / Linuxbrew (Linux)
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          if ! command -v brew &> /dev/null; then
            if [[ "${{ steps.brew-restore-cache.outputs.cache-matched-key }}" != "" ]]; then
              echo "Homebrew restored from cache"
            else
              echo "Installing Homebrew..."
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
          else
            echo "Homebrew already available"
          fi

          # Ensure Homebrew is in PATH for subsequent steps (handle both Apple Silicon and Intel)
          if [[ -d "/opt/homebrew/bin" ]]; then
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          elif [[ -d "/usr/local/bin" ]]; then
            echo "/usr/local/bin" >> $GITHUB_PATH
            echo "/usr/local/sbin" >> $GITHUB_PATH
          fi

          # Set Homebrew environment variables for non-interactive use
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV

        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          if ! command -v brew &> /dev/null; then
            if [[ "${{ steps.brew-restore-cache.outputs.cache-matched-key }}" != "" ]]; then
              echo "Linuxbrew restored from cache"
            else
              echo "Installing Linuxbrew..."
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
          else
            echo "Linuxbrew already available"
          fi

          # Ensure Linuxbrew is in PATH for subsequent steps
          if [[ -d "/home/linuxbrew/.linuxbrew/bin" ]]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
            echo "/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH

            # Set Homebrew environment variables for non-interactive use
            echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
            echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV
            echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          fi
        fi

        # Set environment variables for the save action
        echo "BREW_RESTORED_CACHE_KEY=${{ steps.brew-restore-cache.outputs.cache-matched-key }}" >> $GITHUB_ENV
