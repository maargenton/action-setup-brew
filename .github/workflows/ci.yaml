name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Action
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build action
      run: npm run build

    - name: Check that dist folder is up to date
      run: |
        if [ -n "$(git status --porcelain dist/)" ]; then
          echo "❌ dist/ folder is not up to date!"
          echo "The built files don't match the committed dist/ folder."
          echo "Please run 'npm run build' and commit the changes."
          echo ""
          echo "Changed files:"
          git status --porcelain dist/
          echo ""
          echo "Diff:"
          git diff dist/
          exit 1
        else
          echo "✅ dist/ folder is up to date"
        fi
