name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build action
      run: npm run build

    - name: Check that dist folder is up to date
      run: |
        if [ -n "$(git status --porcelain dist/)" ]; then
          echo "❌ dist/ folder is not up to date!"
          echo "The built files don't match the committed dist/ folder."
          echo "Please run 'npm run build' and commit the changes."
          echo ""
          echo "Changed files:"
          git status --porcelain dist/
          exit 1
        else
          echo "✅ dist/ folder is up to date"
        fi

  test:
    name: Integration Test
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test setup-brew action with jq
      uses: ./
      with:
        packages: jq

    - name: Install yq manually using brew
      run: brew install --quiet yq

    - name: Test versions
      run: |
        echo "=== Brew Version ==="
        brew --version

        echo "=== jq Version ==="
        jq --version

        echo "=== yq Version ==="
        yq --version

        echo "=== Brew List ==="
        brew list --versions

  test-windows:
    name: Windows Test
    needs: build
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test setup-brew action on Windows (should skip gracefully)
      uses: ./
      with:
        packages: jq
