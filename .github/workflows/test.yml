name: Test Setup Brew Action

on:
  workflow_dispatch:
    inputs:
      action_ref:
        description: 'Git ref (SHA, branch, or tag) of the action to test'
        required: true
        default: 'maa/initial'
        type: string

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test setup-brew action with jq
      uses: maargenton/action-setup-brew@${{ github.event.inputs.action_ref }}
      with:
        packages: jq

    - name: Install yq manually using brew
      run: brew install --quiet yq

    - name: Test versions
      run: |
        echo "=== Brew Version ==="
        brew --version

        echo "=== jq Version ==="
        jq --version

        echo "=== yq Version ==="
        yq --version

        echo "=== Brew List ==="
        brew list --versions
